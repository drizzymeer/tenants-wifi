name: Build Tenants WiFi
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build
        working-directory: src
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o tenants-wifi-arm64 .
      - uses: actions/upload-artifact@v4
        with:
          name: tenants-wifi-arm64
          path: src/tenants-wifi-arm64
